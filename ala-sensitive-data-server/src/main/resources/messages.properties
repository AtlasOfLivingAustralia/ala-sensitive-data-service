swagger.title=ALA Sensitive Data API
swagger.description=The ALA sensitive data API reports how a record from a particular region that matches to a particular taxonID is treated by the ALA. This service cannot be reliably used to check if a species is sensitive or not, it is intended for ALA internal use only. It is advised not to use the scientific name alone in these endpoints but to use the current taxonID returned from <a href="{0}" target="_blank" class="link">names-matching</a> instead.<br/>Read the full <a href="{1}" target="_blank" class="link">Sensitive Data Service guide</a> for more details.<br/><br/><a href="{2}" target="_blank" class="link">ALA API documentation</a>
