swagger.title=ALA Sensitive Data API
swagger.description=The Sensitive Data Service (SDS) determines if a taxon is sensitive in a given location as well as obfuscating occurrence records for sensitive taxa. <br/>In order to prevent taxonomic matching errors, users are advised to query endpoints using <kbd>taxonID</kbd> rather than <kbd>scientificName</kbd> by first using the <a href="{0}">Name Matching Service API</a>.<br/>Read the full <a href="{1}">Sensitive Data Service guide</a> for more details.
