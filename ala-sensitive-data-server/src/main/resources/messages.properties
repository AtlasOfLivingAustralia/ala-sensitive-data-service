swagger.title=ALA Sensitive Data API
swagger.description=The Sensitive Data Service (SDS) determines if a taxon is sensitive in a given location as well as obfuscating occurrence records for sensitive taxa. <br/>In order to prevent taxonomic matching errors, users are advised to query endpoints using <kbd>taxonID</kbd> in addition to <kbd>scientificName</kbd>, by first querying the <a href="{0}" target="_blank" class="link">Name Matching Service API</a>.<br/>Read the full <a href="{1}" target="_blank" class="link">Sensitive Data Service guide</a> for more details.<br/><br/><a href="{2}" target="_blank" class="link">ALA API documentation</a>
